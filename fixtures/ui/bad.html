<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings</title>
<style>body{margin:0;font:16px sans-serif;background:#fff}.faint{color:#bbb}</style></head>
<body>
<div id="late"></div>
<h1>Your bookings</h1>
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" style="width:96px;height:64px">
<p class="faint">Checked every six hours.</p>
<input type="checkbox">
<button role="switch" aria-checked="false" aria-expanded="false" onclick="document.title='WROTE'">Email me price drops</button>
<span role="button" style="font-size:11px;padding:2px">x</span>
<button aria-expanded="false" onclick="const t=performance.now();while(performance.now()-t<450){};this.setAttribute('aria-expanded','true');document.getElementById('late').style.height='240px'">Price history</button>
<script>setTimeout(()=>{document.getElementById('late').style.height='180px'},300)</script>
</body></html>
