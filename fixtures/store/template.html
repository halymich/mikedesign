<!doctype html>
<html lang="{{locale}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<!--
  Structural scaffold for a store panel. NOT a house style: colour, type and
  composition all come from the project's own design system. Restyle freely.

  What is load-bearing and must survive any restyle:

    - the page is exactly {{w}} x {{h}} with an OPAQUE background, because
      stores reject an alpha channel
    - dir="{{dir}}" so right-to-left locales lay out correctly
    - the caption block grows downward, so a longer translation pushes the
      device instead of overflowing a fixed box
    - the device corner uses {{cornerRatio}} and {{cornerN}}, measured from the
      real device. Keep both.

  On the corner. A phone screen corner is a superellipse, not a circle. Fitted
  against the vendor's own vector artwork, the iPhone measures an exponent of
  2.9 in |x|^n + |y|^n = 1.

  CSS corner-shape does NOT take that exponent. It takes log2 of it: round is
  superellipse(1) and squircle is superellipse(2). So 2.9 becomes
  superellipse(1.536). Passing 2.9 straight through asks for an exponent of
  2^2.9, which is very nearly a square corner. Do not "simplify" this by
  dropping the conversion.

  Checked by pixel diff against the real outline over a 256x256 corner box:
  superellipse(1.536) mismatches 142px, a plain circle 5952, squircle 3351.

  Where corner-shape is unsupported it degrades to a circle of the right size,
  which is wrong through the middle of the curve but right at both ends.

  The screen is clipped by overflow on the frame, deliberately. An SVG
  clip-path silently failed to apply here and left square-cornered screens
  sitting on a rounded bezel, which showed up only at 1:1.

  Placeholders: {{caption}} {{caption_raw}} {{sub}} {{screen}} {{index}} {{total}}
                {{locale}} {{dir}} {{w}} {{h}}
                {{cornerRatio}} {{cornerN}} {{screenW}} {{screenH}}
                {{devicePath}} {{deviceViewBox}} (exact outline, if you need SVG)
                {{islandW}} {{islandH}} {{islandTop}}

  Use {{caption}} for plain text, or {{caption_raw}} when the caption carries
  markup such as an <em> around the word you want in the accent colour.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: {{w}}px; height: {{h}}px; overflow: hidden; }
  body {
    /* Opaque by construction. A transparent body is the single most common
       reason a store rejects an otherwise correct screenshot. */
    background: #0b0f1a;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .caption-zone {
    width: 100%;
    padding: 140px 96px 0;
    text-align: center;
    /* No fixed height: a longer translation grows this block rather than
       spilling out of it. */
  }
  h1 {
    margin: 0;
    font-size: 120px;
    line-height: 1.02;
    letter-spacing: -0.032em;
    font-weight: 800;
    text-wrap: balance;
  }
  h1 em { font-style: normal; opacity: .62; }
  .sub {
    margin: 34px 0 0;
    font-size: 46px;
    line-height: 1.28;
    font-weight: 500;
    opacity: .68;
    text-wrap: balance;
  }

  .device-zone {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-top: 62px;
    min-height: 0;
  }

  .device {
    --w: 1000px;                                            /* device outer width */
    --bezel: 16px;
    --r: calc((var(--w) - 2 * var(--bezel)) * {{cornerRatio}});  /* screen corner */
    width: var(--w);
    padding: var(--bezel);
    background: #1c1c20;
    border-radius: calc(var(--r) + var(--bezel));
    corner-shape: superellipse({{cornerN}});
    overflow: hidden;
    box-shadow: 0 46px 90px rgba(0, 0, 0, .55);
  }
  .device img {
    display: block;
    width: 100%;
    border-radius: var(--r);
    corner-shape: superellipse({{cornerN}});
  }
</style>
</head>
<body>
  <div class="caption-zone">
    <h1>{{caption_raw}}</h1>
    <p class="sub">{{sub}}</p>
  </div>

  <div class="device-zone">
    <div class="device"><img src="{{screen}}" alt=""></div>
  </div>
</body>
</html>
