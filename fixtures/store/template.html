<!doctype html>
<html lang="{{locale}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<!--
  Structural scaffold for a store panel, not a house style.

  What is load-bearing and must survive any restyle:
    - the page is exactly {{w}} x {{h}} with an OPAQUE background (stores reject alpha)
    - nothing is positioned in absolute pixels that assumes one caption length
    - dir="{{dir}}" so right-to-left locales lay out correctly
    - the caption block grows downward, so longer translations push the device
      rather than overflowing a fixed box

  Everything else (colour, type, the shape of the device frame, whether there is
  a frame at all) comes from the project's own design system. Restyle freely.

  Placeholders: {{caption}} {{sub}} {{screen}} {{index}} {{total}} {{locale}} {{dir}} {{w}} {{h}}
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: {{w}}px; height: {{h}}px;
    overflow: hidden;
  }
  body {
    /* Opaque by construction. A transparent body is the single most common
       reason a store rejects an otherwise correct screenshot. */
    background: #0b0f1a;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .caption-zone {
    width: 100%;
    padding: 150px 110px 0;
    text-align: center;
    /* No fixed height: a longer translation grows this block instead of
       spilling out of it. */
  }
  h1 {
    margin: 0;
    font-size: 118px;
    line-height: 1.06;
    letter-spacing: -0.03em;
    font-weight: 800;
    text-wrap: balance;
  }
  .sub {
    margin: 34px 0 0;
    font-size: 52px;
    line-height: 1.3;
    font-weight: 500;
    opacity: .72;
    text-wrap: balance;
  }

  .device-zone {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding: 90px 0 0;
    min-height: 0;
  }
  .device {
    width: 940px;
    border-radius: 78px;
    padding: 14px;
    background: #23262f;
    box-shadow: 0 40px 90px rgba(0, 0, 0, .55);
    overflow: hidden;
  }
  .device img {
    display: block;
    width: 100%;
    border-radius: 64px;
  }
</style>
</head>
<body>
  <div class="caption-zone">
    <h1>{{caption}}</h1>
    <p class="sub">{{sub}}</p>
  </div>
  <div class="device-zone">
    <div class="device"><img src="{{screen}}" alt=""></div>
  </div>
</body>
</html>
